{% extends "base.html" %}
{% load static %}

{% block title %}Login Dashboard{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm p-4">
    <div class="row">

   <div class="col-md-6 d-flex align-items-center justify-content-center bg-light">

<style>
svg {
    overflow: visible;
}

text {
    user-select: none;
}

/* OUTER CIRCLE DRAW */
.draw-circle {
    stroke-dasharray: 850;
    stroke-dashoffset: 850;
    animation: drawCircle 3s ease forwards;
}

@keyframes drawCircle {
    to {
        stroke-dashoffset: 0;
    }
}

/* ROTATING TEXT */
.rotating-text {
    transform-origin: center;
    animation: rotateText 25s linear infinite;
}

@keyframes rotateText {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* COMMUNITY PULSE */
.community {
    transform-origin: center;
    animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }
}

/* FLOATING DOVES */
.dove-left {
    animation: floatLeft 3s ease-in-out infinite;
}

.dove-right {
    animation: floatRight 3s ease-in-out infinite;
}

@keyframes floatLeft {
    0%,100% {
        transform: translate(140px,150px) scale(-1,1);
    }

    50% {
        transform: translate(140px,145px) scale(-1,1);
    }
}

@keyframes floatRight {
    0%,100% {
        transform: translate(220px,150px);
    }

    50% {
        transform: translate(220px,145px);
    }
}

/* SSJP2 GLOW */
.glow {
    animation: glowPulse 2s infinite;
}

@keyframes glowPulse {
    0% {
        filter: drop-shadow(0 0 2px #0d6efd);
    }

    50% {
        filter: drop-shadow(0 0 10px #0d6efd);
    }

    100% {
        filter: drop-shadow(0 0 2px #0d6efd);
    }
}
</style>

<svg width="420"
     height="420"
     viewBox="0 0 360 360"
     xmlns="http://www.w3.org/2000/svg">

   <defs>
    <!-- Top semicircle: West → Top → East -->
    <path id="topArc"
          d="M 60,180
             A 120,120 0 0,1 300,180" />
</defs>

    <circle class="draw-circle"
            cx="180"
            cy="180"
            r="135"
            stroke="#198754"
            stroke-width="10"
            fill="none"/>

    <circle cx="180"
            cy="180"
            r="60"
            fill="rgba(255,255,255,0.12)"/>

    <g class="community" fill="#198754">
        <circle cx="170" cy="160" r="8"/>
        <rect x="163" y="170" width="14" height="20" rx="6"/>

        <circle cx="150" cy="175" r="7"/>
        <rect x="144" y="183" width="12" height="18" rx="5"/>

        <circle cx="190" cy="175" r="7"/>
        <rect x="184" y="183" width="12" height="18" rx="5"/>
    </g>

    <text x="160"
          y="150"
          font-size="40"
          fill="#ffffff">
        🎼
    </text>

    <g class="glow">
        <rect x="140"
              y="100"
              width="80"
              height="40"
              rx="6"
              fill="#0d6efd"/>

        <text x="180"
              y="126"
              text-anchor="middle"
              dominant-baseline="middle"
              font-size="16"
              font-weight="bold"
              fill="#ffffff">
            SSJP2
        </text>
    </g>

    <g class="dove-left">
        <text font-size="36"
              text-anchor="middle">
            🕊️
        </text>
    </g>

    <g class="dove-right">
        <text font-size="36"
              text-anchor="middle">
            🕊️
        </text>
    </g>

    <text x="180"
          y="220"
          font-size="30"
          text-anchor="middle"
          fill="#ffffff">
        ✝️
    </text>

    <text x="170"
          y="40"
          font-size="45">
        🎼
    </text>

    <g fill="#ffffff">
        <text x="300"
              y="175"
              font-size="30">
            💰
        </text>

        <text x="290"
              y="200"
              font-size="16">
            FRW
        </text>
    </g>

    <text x="175"
          y="345"
          font-size="34">
        🏠
    </text>

    <text x="40"
          y="185"
          font-size="40">
        🤝
    </text>

    <g>
        <text font-size="16"
              fill="#198754"
              font-weight="600">

            <textPath href="#topArc"
                      startOffset="50%"
                      text-anchor="middle">

                Solidarity SJP2 • Social • Financial System • Jali

            </textPath>

        </text>
    </g>

</svg>

</div>

      <!-- RIGHT SIDE -->
      <div class="col-md-6 d-flex align-items-center justify-content-center bg-white p-4">

        <div class="card border-0 shadow-lg rounded-4 w-100" style="max-width: 420px;">

          <div class="card-body p-4">

            <div class="text-center mb-4">
              <h3 class="fw-bold text-primary mb-1">Welcome Back</h3>
              <p class="text-muted small mb-0">
                Sign in to access your SSJP2 dashboard
              </p>
            </div>

            <form method="post">
              {% csrf_token %}


                <label class="form-label fw-semibold text-dark">Username</label>
              <div class="mb-3">
                {{ form.username }}
              </div>

              <div class="mb-2">

  <label class="form-label fw-semibold text-dark">Password</label>

  <div class="input-group">
    {{ form.password }}

    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
      👁️
    </button>
  </div>

</div>

              <div class="text-end mb-4">
                <a href="{% url 'accounts:password_reset' %}"
                   class="text-primary small text-decoration-none">
                  Forgot password?
                </a>
              </div>

              <div class="d-flex justify-content-between align-items-center gap-2">
  <!-- SIGN IN -->
  <button type="submit"
          class="btn btn-primary py-2 fw-semibold shadow-sm">
    Sign In
  </button>

  <!-- Back -->
  <a href="{% url 'accounts:logout' %}"
     class="btn btn-outline-danger btn-sm">
    Back
  </a>
</div>

            </form>



          </div>

        </div>

      </div>

    </div>

  </div>

</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("togglePassword");
    const passwordInput = document.querySelector("input[type='password']");

    toggle.addEventListener("click", function () {
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggle.innerText = "🙈";
        } else {
            passwordInput.type = "password";
            toggle.innerText = "👁️";
        }
    });
});
</script>

{% endblock %}
